backend:
  name: github
  repo: Matail/matail.party
  branch: main
  base_url: https://decap-oauth.matail.workers.dev
  auth_endpoint: auth

media_folder: "src/assets/blog"
public_folder: "/src/assets/blog"

collections:
  - name: "blog"
    label: "블로그 글"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "설명", name: "description", widget: "string" }
      - { label: "발행일", name: "pubDate", widget: "datetime" }
      - { label: "태그", name: "tags", widget: "list", required: false }
      - label: "줄 (분류)"
        name: "category"
        widget: "select"
        options:
          - { label: "작업 기록", value: "devlog" }
          - { label: "만드는 법", value: "craft" }
          - { label: "딴생각", value: "notes" }
        default: "devlog"
      - label: "표지 그림"
        name: "cover"
        widget: "image"
        required: false
        media_folder: "/public/art/blog"
        public_folder: "/art/blog"
        hint: "카드와 글 머리에 깔리는 그림. 가로 400px 안팎(400x248)의 픽셀아트가 잘 맞습니다"
      - { label: "맨 위 큰 카드로 올리기", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "본문", name: "body", widget: "markdown" }

  - name: "games"
    label: "게임"
    folder: "src/content/games"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "설명 (긴 글)", name: "description", widget: "text" }
      - { label: "짧은 설명 (카드용)", name: "shortDescription", widget: "string", required: false }
      - { label: "게임 URL", name: "url", widget: "string", hint: "내부 게임: /games/이름/ · 외부 게임: https://..." }
      - label: "유형"
        name: "type"
        widget: "select"
        options:
          - { label: "내부 (같은 사이트)", value: "internal" }
          - { label: "외부 (서브도메인/외부링크)", value: "external" }
        default: "internal"
      - { label: "엔진", name: "engine", widget: "string", required: false, hint: "html, unity, unreal, godot 등" }
      - label: "썸네일 색상"
        name: "color"
        widget: "select"
        options:
          - { label: "라임", value: "lime" }
          - { label: "핑크", value: "pink" }
          - { label: "시안", value: "cyan" }
        default: "lime"
      - { label: "썸네일 이모지/텍스트", name: "thumb", widget: "string", default: "🎮" }
      - label: "카드 키아트"
        name: "art"
        widget: "image"
        required: false
        media_folder: "/public/art"
        public_folder: "/art"
        hint: "홈 덱 카드와 목록 카드에 깔리는 그림. 가로 400px 안팎의 픽셀아트가 잘 맞습니다"
      - { label: "카드 색", name: "accent", widget: "string", required: false, pattern: ['^#[0-9A-Fa-f]{6}$', '#RRGGBB 형식으로 적어주세요'], hint: "예: #F32BC8 — 이 카드를 볼 때 무대 빛·점·버튼이 이 색이 됩니다" }
      - { label: "카드 위 큰 글씨", name: "lettering", widget: "string", required: false, hint: "영문/숫자만. | 를 넣으면 줄바꿈 (예: AIM|BOOSTER). 비우면 제목을 씁니다" }
      - label: "호버 엠블럼"
        name: "emblem"
        widget: "image"
        required: false
        media_folder: "/public/art"
        public_folder: "/art"
        hint: "카드에 커서를 올리면 나타나는 움직이는 그림. 9칸이 가로로 이어진 스프라이트 시트여야 합니다"

      - { label: "태그", name: "tags", widget: "list", required: false }
      - { label: "출시일", name: "releaseDate", widget: "datetime" }
      - label: "상태"
        name: "status"
        widget: "select"
        options:
          - { label: "공개 (Published)", value: "published" }
          - { label: "작업 중 (WIP)", value: "wip" }
          - { label: "계획 중 (Planned)", value: "planned" }
        default: "published"
      - { label: "본문 (상세 페이지용)", name: "body", widget: "markdown" }