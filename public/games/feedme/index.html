    <script>

        document.head.appendChild(meta);
        document.body.classList.add('mobile');

        arguments: [],
        dataUrl: "Build/88e17f7f1a1039e600a80efe846e839a.data",
        frameworkUrl: "Build/a64beca7e58e389e56c462824acf841e.framework.js",

        document.getElementById("loading").remove();

      });
