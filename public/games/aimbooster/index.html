    <style>
      :root {

        --text-mute: #8A8894;

      *, *::before, *::after { box-sizing: border-box; }

      /* 게임 화면: 창 안에 들어가는 가장 큰 16:9 */
      .stage { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; }

      #unity-canvas { display: block; width: 100%; height: 100%; background: #07070b; outline: none; }

      .bar { width: min(280px, 50%); height: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .bar > span { display: block; height: 100%; width: 0; background: var(--lamp); box-shadow: 0 0 12px rgba(255, 180, 70, 0.7); transition: width 0.2s; }

      .fullscreen {
        position: absolute; right: 12px; bottom: 12px; padding: 6px 12px; border: 0; border-radius: 999px;
        background: rgba(0, 0, 0, 0.35); color: var(--text-mute); font: inherit; font-size: 0.8rem; cursor: pointer;

  <body>
    <a href="/" class="back-link">← 홈으로</a>
    <!-- 게임 화면은 캔버스라 글자가 없다 — 검색·스크린리더용 소개 -->
    <h1 class="sr-only">Aimbooster</h1>
    <p class="sr-only">레트로 사격장의 왼쪽 · 정면 · 오른쪽 벽에 나타나는 과녁을 1인칭으로 쏘아 맞히는 에임 게임. 15초마다 LEVEL 이 오르고 3번 놓치면 끝. 명중률 · 반응 시간 통계와 상위 % 까지, 설치 없이 브라우저에서 바로.</p>
    <main class="stage">
      <div class="frame">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div class="loading" id="loading">
          <span>LOADING</span>
          <div class="bar"><span id="bar"></span></div>
        </div>
        <button class="fullscreen" id="fullscreen" type="button">전체화면</button>
      </div>
    </main>
    <script>
      // 마우스(정밀한 포인터)가 하나도 없으면 게임을 내려받지 않는다
      if (!matchMedia("(any-pointer: fine)").matches) {
        document.getElementById("loading").innerHTML =
          '<p class="notice">마우스로 조준하는 게임이라<br>컴퓨터에서 할 수 있어요.<br><br><a href="/stats/aimbooster/">사람들의 기록 보기 →</a></p>';
        document.getElementById("fullscreen").remove();
      } else {
        var loader = document.createElement("script");
        loader.src = "Build/ec738763367528feb5c1018b1288ec18.loader.js";
        loader.onload = start;
        document.body.appendChild(loader);
      }

      function start() {
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/3dd86a8a1822e53b61dd37a13a25fa0b.data",
        frameworkUrl: "Build/9b4532f171b6e4ebc736cf82224af12d.framework.js",
        codeUrl: "Build/2ad629459d4dbfd6ec9e27de23ce8cfd.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Matail",
        productName: "AimBooster",
        productVersion: "1.0",
      }, (progress) => {
        document.getElementById("bar").style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        document.getElementById("loading").remove();
        document.getElementById("fullscreen").onclick = () => unityInstance.SetFullscreen(1);
      }).catch((message) => {
        document.getElementById("loading").textContent = "게임을 불러오지 못했어요. 새로고침해 주세요.";
        console.error(message);
      });
      }
    </script>
